garage:()=>`${head('Мой гараж')}<div class="card hero" style="height:190px"><img src="car-hero.png"><div class="heroText"><span class="badge">Vehicle ID</span><h1>BMW X3</h1><p>VIN WBA••••1234 · 42 800 км</p></div></div>${[['История и VERIFIED','94% подтверждено','report'],['Документы','СТС · ПТС · полисы','garage'],['Страхование','ОСАГО 47 дней','insurance'],['CARE',mode==='CARE'?'Активен':'Не подключён','care'],['ТО и ремонты','7 событий','service'],['Расходы','Сервис · штрафы · страхование','garage'],['Финансы','Кредиты и рассрочки','finance']].map(x=>`<div class="card list" onclick="${x[2]==='finance'?`financeType='repair';`:''}render('${x[2]}')"><div class="icon">✓</div><div class="grow"><b>${x[0]}</b><div class="muted">${x[1]}</div></div><b>›</b></div>`).join('')}`,

ai:()=>`${head('BiBi AI')}<div class="card"><div class="row"><div class="aiOrb" style="margin:0">◉</div><div><b>Авто-ассистент</b><div class="muted">Знает демо-Гараж, Market и сценарии BiBi</div></div></div></div><div id="chat" class="chat"><div class="bubble bot">Добрый вечер. По BMW есть 3 момента: ОСАГО заканчивается через 47 дней, ТО через 1 800 км и 2 неоплаченных штрафа. Чем помочь?</div></div><div class="quick"><button onclick="askAI('Загорелся Check Engine и машина трясётся')">Check Engine</button><button onclick="askAI('Хочу продать машину')">Продать авто</button><button onclick="askAI('Найди кроссовер до 4 млн')">Авто до 4 млн</button><button onclick="askAI('Мне нужен ремонт, денег сейчас нет')">Ремонт в рассрочку</button></div><div class="chatInput"><input id="aiInput" placeholder="Напишите вопрос BiBi AI" onkeydown="if(event.key==='Enter')sendAI()"><button onclick="sendAI()">↑</button></div><div class="disclaimer">BiBi AI Demo Engine: контролируемые сценарии прототипа. Это не подключение к реальной LLM.</div>`,
policyDone:()=>`${head('Полис оформлен')}<div class="center"><div class="success">✓</div><h1>${window.policyType||'ОСАГО'} оформлен</h1><p class="muted">${window.policyInsurer||''} · ${money(window.policyAmount||0)}</p></div><div class="card"><div class="list"><div class="icon">▣</div><div><b>Полис добавлен в Гараж</b><div class="muted">Демо-оформление завершено. Реальный выпуск будет подключён через API страховщика.</div></div></div></div><button class="btn primary" onclick="render('garage')">Открыть Гараж</button>`,
payment:()=>`${head('Оплата')}<div class="card"><div class="muted">К оплате</div><div class="calcBig">${money(window.payAmount||0)}</div><h3>${window.payTitle||''}</h3></div><div class="card list"><div class="icon">₽</div><div class="grow"><b>СБП</b><div class="muted">Демо-способ оплаты</div></div><b>✓</b></div><div class="card list"><div class="icon">▣</div><div class="grow"><b>Банковская карта</b><div class="muted">•••• 4242</div></div></div><button class="btn primary" onclick="finishPay()">Подтвердить оплату</button><div class="disclaimer">Платёж не проводится. Экран демонстрирует будущий checkout.</div>`};
function pay(title,amount,next){window.payTitle=title;window.payAmount=amount;window.payNext=next;render('payment')}function buyPolicy(type,insurer,amount){window.policyType=type;window.policyInsurer=insurer;window.policyAmount=amount;pay(type+' · '+insurer,amount,'policyDone')}function finishPay(){toast('Демо-оплата успешна');setTimeout(()=>render(window.payNext||'home'),350)}
function calcFinance(){let auto=financeType==='auto',term=+document.getElementById('term').value,principal;if(auto){let down=+document.getElementById('down').value;document.getElementById('downVal').textContent=money(down);principal=currentCar.price-down}else principal=80400;document.getElementById('termVal').textContent=term+' мес.';let demoRate=auto?.018:.015;let pay=principal*(demoRate*Math.pow(1+demoRate,term))/(Math.pow(1+demoRate,term)-1);document.getElementById('monthPay').textContent=money(pay)+'/мес.'}
function sendAI(){let i=document.getElementById('aiInput');if(!i.value.trim())return;askAI(i.value);i.value=''}function askAI(q){let c=document.getElementById('chat');if(!c)return;c.innerHTML+=`<div class="bubble user">${q.replace(/</g,'&lt;')}</div>`;let s=q.toLowerCase(),ans='',action='';if(/check|чек|тряс|двигат/.test(s)){ans='Если Check Engine мигает и есть вибрация, продолжать движение нежелательно. Для демо могу сразу открыть эвакуатор или подбор СТО.';action=`<button class="chip" onclick="render('help')">Помощь</button> <button class="chip" onclick="render('service')">Найти СТО</button>`}else if(/прод/.test(s)){ans='Ваш BMW X3: 2023 год, 42 800 км, VERIFIED 94%. Демонстрационная оценка 4,1–4,4 млн ₽. Можно начать подготовку объявления.';action=`<button class="chip" onclick="render('sell')">Подготовить продажу</button>`}else if(/до 4|кроссов|купить|машин/.test(s)){let list=cars.filter(x=>x.price<=4000000).slice(0,4).map(x=>x.brand+' '+x.model).join(', ');ans='В Market до 4 млн ₽ есть: '+list+'. Могу открыть каталог с VERIFIED-отчётами.';action=`<button class="chip" onclick="render('market')">Открыть Market</button>`}else if(/денег|расср|кредит.*рем|ремонт/.test(s)){ans='Для ремонта BiBi показывает согласованную смету и отдельный сценарий финансирования. В демо смета 80 400 ₽ — можно рассчитать срок и ориентировочный платёж.';action=`<button class="chip" onclick="financeType='repair';render('finance')">Рассчитать</button>`}else if(/осаго|каско|страх/.test(s)){ans='Текущее ОСАГО заканчивается через 47 дней. В разделе страхования доступны карточки реальных страховщиков; цены в прототипе помечены как демонстрационные.';action=`<button class="chip" onclick="render('insurance')">Страхование</button>`}else if(/штраф/.test(s)){ans='Сейчас в демо 2 штрафа на 3 500 ₽. Их можно открыть и пройти сценарий оплаты.';action=`<button class="chip" onclick="render('fines')">Открыть штрафы</button>`}else if(/care|платн|подпис/.test(s)){ans=mode==='CARE'?'CARE уже активен на этом автомобиле.':'Вы используете FREE. CARE стоит 6 990 ₽/год в текущей концепции; можно показать весь путь подключения.';action=`<button class="chip" onclick="render('care')">BiBi CARE</button>`}else if(/кредит|платеж|автокредит/.test(s)){ans='Откройте автомобиль в Market — BiBi рассчитает первоначальный взнос, срок и ориентировочный ежемесячный платёж.';action=`<button class="chip" onclick="render('market')">Выбрать авто</button>`}else if(/провер|vin|истор|verified/.test(s)){ans='BiBi VERIFIED разделяет подтверждённые события и внешние данные: пробег, владельцев, ДТП, ремонты, ТО и диагностики. У каждого объявления свой отчёт.';action=`<button class="chip" onclick="render('market')">Выбрать авто</button>`}else{ans='Я могу помочь с эвакуатором, СТО, ремонтом в рассрочку, штрафами, ОСАГО/КАСКО, CARE, проверкой автомобиля, покупкой, продажей и автокредитом. Попробуйте сформулировать задачу обычными словами.'}setTimeout(()=>{c.innerHTML+=`<div class="bubble bot">${ans}<div style="margin-top:9px">${action}</div></div>`;c.scrollTop=c.scrollHeight},250)}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render('home',false);
</script></body></html>
